name: "Platform Governance Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Mandatory for OIDC authentication to Azure
  contents: write # Required to push git tags and create releases
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VERSION: "1.11.1"

jobs:
  # -------------------------------------------------------------
  # Job 1: Validate & Speculative Plan (PR Gate)
  # -------------------------------------------------------------
  terraform-plan:
    name: "Terraform Lint & Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -backend-config="resource_group_name=state-mgmt-dev" \
            -backend-config="storage_account_name=statemgmtdev01" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=governance/dev.governance.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="management_group_id=${{ secrets.AZURE_MANAGEMENT_GROUP_ID }}" \
            -var="governance_version=PR-${{ github.event.pull_request.number }}-preview" \
            -no-color -out=tfplan

  # -------------------------------------------------------------
  # Job 2: Tag & Apply (Post-Merge to main)
  # -------------------------------------------------------------
  terraform-apply:
    name: "Automate Tag & Terraform Apply"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pull full git history for correct tag calculation

      # Auto-generate Git Tag based on commits/releases
      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          release_branches: main
          tag_prefix: "v"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="subscription_id=${{ env.ARM_SUBSCRIPTION_ID }}" \
            -backend-config="resource_group_name=state-mgmt-dev" \
            -backend-config="storage_account_name=statemgmtdev01" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=governance/dev.governance.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform Apply
        run: |
          CURRENT_RELEASE="${{ steps.tag_version.outputs.new_tag || 'v2026.1.0' }}"
          CLEAN_VERSION="${CURRENT_RELEASE#v}"

          terraform apply -auto-approve \
            -var="management_group_id=${{ secrets.AZURE_MANAGEMENT_GROUP_ID }}" \
            -var="governance_version=${CLEAN_VERSION}"

      - name: Create GitHub Release via GH CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag || 'v2026.1.0' }}
        run: |
          gh release create "$NEW_TAG" \
            --title "Release $NEW_TAG" \
            --notes "Platform Governance Policy Set Release $NEW_TAG. Synced and applied to Azure Resource Manager."
